# Render blueprint — deploys LocalCraft as a static site.
# Docs: https://render.com/docs/blueprint-spec
#
# The repo carries both package-lock.json and pnpm-lock.yaml, so the build
# command installs pnpm explicitly instead of relying on lockfile detection.
services:
  - type: web
    name: localcraft
    runtime: static
    buildCommand: npm install -g pnpm@11 && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./dist
    routes:
      # SPA fallback for deep links; prerendered pages are served first
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Vite hashes asset filenames, so they can be cached immutably.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SITE_URL
        value: https://localcraft-xb4o.onrender.com
